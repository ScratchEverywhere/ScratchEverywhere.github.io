name: Deploy to GitHub Pages

on:
  push:
    branches: [release, nightly]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          path: release

      - name: Checkout nightly
        uses: actions/checkout@v4
        with:
          ref: nightly
          path: nightly

      - uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build release (/)
        working-directory: release
        env:
          BASE_PATH: /
        run: |
          bun install --frozen-lockfile
          bun run docs:build

      - name: Build nightly (/nightly/)
        working-directory: nightly
        env:
          BASE_PATH: /nightly/
        run: |
          bun install --frozen-lockfile
          bun run docs:build

      - name: Combine sites
        run: |
          mkdir -p _site/nightly
          cp -r release/.vitepress/dist/. _site/
          cp -r nightly/.vitepress/dist/. _site/nightly/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
